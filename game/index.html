<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DUSTLINE — a tactical round shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1c1a16; font-family: 'Segoe UI', system-ui, sans-serif; color: #f5efe2; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud button { pointer-events: auto; }

  /* crosshair: centre dot + 4 ticks, gap follows weapon bloom */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 6px; }
  #crosshair .dot { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: #ff7a1a; }
  #crosshair .t { position: absolute; background: #ff7a1a; }
  #crosshair .up { left: -1px; top: calc(-10px - var(--gap)); width: 2px; height: 8px; }
  #crosshair .down { left: -1px; top: calc(2px + var(--gap)); width: 2px; height: 8px; }
  #crosshair .left { left: calc(-10px - var(--gap)); top: -1px; width: 8px; height: 2px; }
  #crosshair .right { left: calc(2px + var(--gap)); top: -1px; width: 8px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold; opacity: 0; text-shadow: 0 0 6px #000; }

  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 800; letter-spacing: 2px; padding: 6px 16px; border-radius: 4px; background: rgba(10,10,12,.6); }
  #objective.attack { color: #ffb37a; border: 1px solid #ff7a1a; }
  #objective.defend { color: #9ecfff; border: 1px solid #4a6fa5; }
  #timer { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 800; text-shadow: 0 2px 4px #000; }
  #timer.bomb { font-size: 34px; color: #ff5a3c; animation: bombPulse 1s infinite; }
  @keyframes bombPulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.12); } }
  #score { position: absolute; top: 14px; right: 16px; font-size: 15px; font-weight: 700; background: rgba(10,10,12,.6); padding: 6px 12px; border-radius: 4px; }
  #money { position: absolute; top: 52px; right: 16px; font-size: 18px; font-weight: 800; color: #ffd76a; text-shadow: 0 2px 4px #000; }
  #health { position: absolute; left: 16px; bottom: 16px; width: 220px; }
  #health .bar { height: 14px; background: rgba(10,10,12,.65); border: 1px solid #555; border-radius: 3px; overflow: hidden; }
  #health .fill { height: 100%; width: 100%; background: #3f8f5f; transition: width .15s; }
  #health .num { position: absolute; right: 0; top: -22px; font-size: 22px; font-weight: 800; text-shadow: 0 2px 4px #000; }
  #ammo { position: absolute; right: 16px; bottom: 16px; text-align: right; font-size: 30px; font-weight: 800; text-shadow: 0 2px 4px #000; }
  #ammo .res { font-size: 16px; color: #cbb; margin-left: 6px; }
  #weaponName { position: absolute; right: 16px; bottom: 56px; font-size: 14px; font-weight: 700; color: #ddd; text-shadow: 0 1px 3px #000; }
  #banner { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 3px 8px #000; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #plant { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 260px; display: none; text-align: center; font-weight: 800; letter-spacing: 2px; }
  #plant .bar { height: 10px; background: rgba(10,10,12,.65); border: 1px solid #ff7a1a; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  #plant .fill { height: 100%; width: 0%; background: #ff7a1a; }
  #feed { position: absolute; top: 96px; right: 16px; text-align: right; font-size: 14px; font-weight: 600; }
  #feed div { background: rgba(10,10,12,.55); padding: 3px 8px; margin-top: 4px; border-radius: 3px; }
  #timeline { position: absolute; left: 16px; top: 96px; font-size: 13px; color: #ddd; }
  #timeline div { background: rgba(10,10,12,.45); padding: 2px 8px; margin-top: 3px; border-radius: 3px; }
  #timeline span { color: #ffb37a; font-weight: 700; margin-right: 6px; }
  #spectate { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: #9ecfff; text-shadow: 0 2px 4px #000; }
  #dmgFlash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(200,20,20,.55) 100%); opacity: 0; transition: opacity .18s; }
  #whiteFlash { position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity .6s; }
  #moneyPop { position: absolute; top: 86px; right: 16px; font-size: 20px; font-weight: 900; color: #7dff9a; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .4s, transform .4s; }

  #buyMenu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; background: rgba(12,12,14,.92); border: 1px solid #ff7a1a; border-radius: 8px; padding: 16px; display: none; }
  #buyMenu h2 { font-size: 18px; margin-bottom: 10px; color: #ffd76a; }
  #buyMenu .items button { display: block; width: 100%; text-align: left; margin: 5px 0; padding: 9px 12px; font-size: 15px; background: #2a2620; color: #f5efe2; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
  #buyMenu .items button:hover { border-color: #ff7a1a; background: #3a3226; }
  #buyMenu .items button.owned { opacity: .45; }
  #buyMenu .items span { float: right; color: #ffd76a; font-weight: 700; }
  #buyMenu .items em { float: right; margin-right: 10px; color: #9ecfff; font-style: normal; }
  #buyMenu .hint { margin-top: 10px; font-size: 12px; color: #aaa; }

  #matchEnd { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,12,.72); text-align: center; }
  #matchEnd h1 { font-size: 44px; letter-spacing: 3px; }
  #matchEnd .sc { font-size: 22px; margin: 12px 0 24px; color: #ffd76a; }
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,12,.66); text-align: center; pointer-events: auto; }
  #menu h1 { font-size: 64px; letter-spacing: 8px; color: #ff7a1a; text-shadow: 0 4px 16px #000; }
  #menu .sub { font-size: 17px; margin: 8px 0 20px; color: #ddd; }
  #menu .brief { max-width: 620px; text-align: left; background: rgba(12,12,14,.8); border: 1px solid #555; border-radius: 8px; padding: 16px 20px; font-size: 14.5px; line-height: 1.65; }
  #menu .brief b { color: #ffb37a; }
  #playBtn { margin-top: 22px; font-size: 20px; font-weight: 800; letter-spacing: 2px; padding: 14px 42px; background: #ff7a1a; color: #1c1a16; border: none; border-radius: 6px; cursor: pointer; }
  #playBtn:hover { background: #ffa04d; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
